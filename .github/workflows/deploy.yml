name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Reconstruye el sitio para actualizar las páginas "UF hoy", "Dólar hoy", etc.
  # 04:15 UTC ≈ 01:15 en Chile (UF del día) y 13:30 UTC ≈ 10:30 (dólar observado publicado)
  schedule:
    - cron: '15 4 * * *'
    - cron: '30 13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Prueba de humo (todas las rutas renderizan sin errores)
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          node scripts/smoke.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
